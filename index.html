<style>
  /* Envelope de duas abas sobre o convite: o selo segura a fita; tocar abre as abas e segue para o Canva */
  :root{
    --paper:#cfe2f6;
    --paper-deep:#b9d2ec;
    --inside:#eef5fc;
    --ink:#4f6f93;
    --white:#ffffff;
    --display:"Marcellus", "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --u:min(100vw, 56.28dvh);
    color-scheme:only light;
  }
  @supports not (height:1dvh){ :root{ --u:min(100vw, 56.28vh); } }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--display);color:var(--ink)}

  .stage{position:fixed;inset:0;perspective:1800px;cursor:pointer;
    background:radial-gradient(120% 80% at 50% 45%, var(--white), var(--inside) 55%, var(--paper-deep));}

  /* Lado de dentro: o próprio convite */
  .inside{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:max(12px, env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) max(12px, env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px));
    opacity:0;transform:scale(.96);transition:opacity .7s ease .75s, transform .9s cubic-bezier(.2,.7,.2,1) .75s}
  .open .inside{opacity:1;transform:none}
  .card{position:relative;width:min(100%, calc((100dvh - 24px) * 602 / 841));aspect-ratio:602/841;
    border-radius:6px;overflow:hidden;background:var(--white);box-shadow:0 18px 50px rgba(60,95,130,.28), 0 2px 6px rgba(60,95,130,.15)}
  .card img{display:block;width:100%;height:100%;max-width:none}
  .loc{position:absolute;left:36.5%;top:76.2%;width:27.4%;height:7.6%;border-radius:8px;cursor:pointer}
  .loc::after{content:"";position:absolute;inset:14% 7%;border-radius:6px;box-shadow:0 0 0 0 rgba(90,150,220,.55);
    animation:locpulse 2s ease-out 2.2s infinite}
  .loc:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  @keyframes locpulse{0%{box-shadow:0 0 0 0 rgba(90,150,220,.55)}100%{box-shadow:0 0 0 12px rgba(90,150,220,0)}}

  /* Abas do envelope */
  .door{position:absolute;top:0;bottom:0;width:50.2%;background-repeat:no-repeat;background-size:cover;
    transition:transform 1.25s cubic-bezier(.6,.02,.25,1) .35s, filter 1.25s ease .35s;
    backface-visibility:hidden;will-change:transform}

  .seal:focus-visible{outline:3px solid var(--white);outline-offset:6px;border-radius:50%}
  .seal::after{content:"";position:absolute;inset:-8%;border-radius:50%;border:2px solid rgba(255,255,255,.75);
    animation:ring 2.4s ease-out infinite;pointer-events:none}
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.045)}}
  @keyframes ring{0%{transform:scale(.85);opacity:0}30%{opacity:.9}100%{transform:scale(1.25);opacity:0}}
  .open .seal{animation:pop .55s cubic-bezier(.3,.6,.4,1) forwards}
  .open .seal::after{display:none}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(1)}25%{transform:translate(-50%,-50%) scale(.9)}
    100%{transform:translate(-50%,-50%) scale(1.5) rotate(-12deg);opacity:0}}

  .hint{position:absolute;left:0;right:0;top:85%;z-index:2;text-align:center;color:#2f4f75;font-weight:600;
    font-size:calc(var(--u)*0.038);letter-spacing:.18em;line-height:1.7;text-transform:uppercase;
    -webkit-text-stroke:.3px #2f4f75;
    text-shadow:0 0 2px #fff,0 0 4px #fff,0 0 8px rgba(255,255,255,.9),0 1px 0 #fff;padding:0 max(16px, env(safe-area-inset-left,0px));
    transition:opacity .3s ease;pointer-events:none}
  .open .hint{opacity:0}

  @media (prefers-reduced-motion: reduce){
    .seal,.seal::after{animation:none}
    .door,.inside,.open .door{transition-duration:.01s;transition-delay:0s}
    .loc::after{animation:none}
  }
</style>

<script>
(function(){
  var stage = document.getElementById('stage');
  var opened = false;
  function abrir(){
    if (opened) return; opened = true;
    try { if (navigator.vibrate) navigator.vibrate(25); } catch(_){}
    stage.classList.add('open');
    stage.style.cursor = 'default';
    stage.setAttribute('aria-label', 'Convite');
  }
  // O envelope inteiro é tocável, não só o selo
  stage.addEventListener('click', abrir);
  document.addEventListener('keydown', function(e){ if (!opened && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); abrir(); } });
})();
</script>
