<style>
  /* Envelope de duas abas sobre o convite: o selo segura a fita; tocar abre as abas e segue para o Canva */
  :root{
    --paper:#cfe2f6;
    --paper-deep:#b9d2ec;
    --inside:#eef5fc;
    --ink:#4f6f93;
    --white:#ffffff;
    --display:"Marcellus", "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --u:min(100vw, 56.28dvh);
    color-scheme:light;
  }
  @supports not (height:1dvh){ :root{ --u:min(100vw, 56.28vh); } }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--display);color:var(--ink)}

  .stage{position:fixed;inset:0;perspective:1800px;cursor:pointer;
    background:radial-gradient(120% 80% at 50% 45%, var(--white), var(--inside) 55%, var(--paper-deep));}

  /* Lado de dentro (aparece quando as abas abrem) */
  .inside{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--u)*0.04);text-align:center;padding:0 max(16px, env(safe-area-inset-left,0px));opacity:0;transition:opacity .6s ease .9s}
  .open .inside{opacity:1}
  .mono{font-size:calc(var(--u)*0.22);line-height:1;color:var(--ink);opacity:.85}
  .msg{font-size:calc(var(--u)*0.04);letter-spacing:.2em;text-transform:uppercase}
  .go{display:inline-block;margin-top:calc(var(--u)*0.02);padding:.85em 1.6em;border-radius:999px;
    font:inherit;font-size:calc(var(--u)*0.036);letter-spacing:.14em;text-transform:uppercase;
    color:var(--white);background:var(--ink);text-decoration:none;box-shadow:0 6px 18px rgba(79,111,147,.25)}
  .go:focus-visible{outline:3px solid var(--ink);outline-offset:4px}

  /* Abas do envelope */
  .door{position:absolute;top:0;bottom:0;width:50.2%;background-repeat:no-repeat;background-size:cover;
    transition:transform 1.25s cubic-bezier(.6,.02,.25,1) .35s, filter 1.25s ease .35s;
    backface-visibility:hidden;will-change:transform}

  .seal:focus-visible{outline:3px solid var(--white);outline-offset:6px;border-radius:50%}
  .seal::after{content:"";position:absolute;inset:-8%;border-radius:50%;border:2px solid rgba(255,255,255,.75);
    animation:ring 2.4s ease-out infinite;pointer-events:none}
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.045)}}

  .open .seal{animation:pop .55s cubic-bezier(.3,.6,.4,1) forwards}
  .open .seal::after{display:none}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(1)}25%{transform:translate(-50%,-50%) scale(.9)}
    100%{transform:translate(-50%,-50%) scale(1.5) rotate(-12deg);opacity:0}}

  .hint{position:absolute;left:0;right:0;top:85%;z-index:2;text-align:center;color:var(--white);
    font-size:calc(var(--u)*0.034);letter-spacing:.2em;line-height:1.6;text-transform:uppercase;
    text-shadow:0 1px 3px rgba(60,95,130,.35);padding:0 max(16px, env(safe-area-inset-left,0px));
    transition:opacity .3s ease;pointer-events:none}
  .open .hint{opacity:0}

  @media (prefers-reduced-motion: reduce){
    .seal,.seal::after{animation:none}
    .door,.inside{transition-duration:.01s;transition-delay:0s}
  }

</head>
<body>
<main class="stage" id="stage" aria-label="Envelope do convite">
  <div class="inside" aria-live="polite">
    <div class="mono" aria-hidden="true">R</div>
    <div class="msg">Abrindo seu convite…</div>
    <a class="go" id="go" href="https://celizemoraisconsultoria.my.canva.site/convite-formatura-do-rael" rel="noopener">Ver convite</a>
  </div>
  <div class="door l"><div class="rib"></div></div>
  <div class="door r"><div class="rib"></div></div>
  <button class="seal" id="seal" type="button" aria-label="Abrir o convite"></button>
  <p class="hint">Você recebeu um convite especial.<br>Toque no selo para abrir!</p>
</main>
<script>
(function(){
  var URL_CONVITE = "https://celizemoraisconsultoria.my.canva.site/convite-formatura-do-rael";
  var stage = document.getElementById('stage');
  var opened = false;
  function abrir(e){
    if (e && e.target && e.target.id === 'go') return;
    if (opened) return; opened = true;
    try { if (navigator.vibrate) navigator.vibrate(25); } catch(_){}
    stage.classList.add('open');
    var reduz = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function(){ window.location.href = URL_CONVITE; }, reduz ? 300 : 2100);
  }
  // O envelope inteiro é tocável, não só o selo — assim ninguém fica perdido
  stage.addEventListener('click', abrir);
  document.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') abrir(); });
  // Se a pessoa voltar do convite pelo botão "voltar", o envelope aparece fechado de novo
  window.addEventListener('pageshow', function(ev){ if (ev.persisted){ opened = false; stage.classList.remove('open'); } });
})();
</script>
</body>
